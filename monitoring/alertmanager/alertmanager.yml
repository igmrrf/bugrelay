global:
  # SMTP configuration - environment specific
  smtp_smarthost: 'mailhog:1025'
  smtp_from: 'alerts@bugrelay.local'
  smtp_auth_username: '-'
  smtp_auth_password: '-'
  smtp_require_tls: false

route:
  group_by: ['alertname', 'environment', 'severity']
  # Development: faster grouping, Production: slower for batching
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 30m
      routes:
        # Database critical alerts
        - match:
            service: database
          receiver: 'database-critical'
        # Security critical alerts
        - match:
            category: security
          receiver: 'security-critical'

    # Warning alerts - less frequent notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 2m
      repeat_interval: 2h
      routes:
        # Security warnings
        - match:
            category: security
          receiver: 'security-warnings'

    # Monitoring system alerts
    - match_re:
        job: '(prometheus|alertmanager|grafana).*'
      receiver: 'monitoring-alerts'

    # Deployment alerts - immediate notification for failures and rollbacks
    - match:
        alert_type: deployment
      receiver: 'deployment-alerts'
      group_wait: 10s
      repeat_interval: 30m
      routes:
        # Critical deployment alerts (failures, rollbacks)
        - match:
            severity: critical
          receiver: 'deployment-critical'
        # Warning deployment alerts (health checks, long running)
        - match:
            severity: warning
          receiver: 'deployment-warnings'

receivers:
  # Default receiver for unmatched alerts
  - name: 'default-receiver'
    email_configs:
      - to: 'dev-team@bugrelay.local'
        text: |
          Environment: development
          [dev] BugRelay Alert: {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'ops-team@bugrelay.local'
        text: |
          🚨 CRITICAL ALERT - development 🚨 
          🚨 [dev CRITICAL] {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .Annotations.runbook_url }}
          
          📖 Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}
          
          This is a critical alert requiring immediate attention.
        headers:
          X-Priority: 'high'
          X-Environment: 'development'
    
    # Slack configuration (if enabled)
    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#alerts-critical'
        title: '🚨 [dev] Critical: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          
          *Service:* {{ .Labels.service }}
          *Severity:* {{ .Labels.severity }}
          *Environment:* development
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        send_resolved: true

    # PagerDuty integration (production only)
    pagerduty_configs:
      - routing_key: '-'
        description: '[dev] {{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        severity: 'critical'

  # Database critical alerts
  - name: 'database-critical'
    email_configs:
      - to: 'dba-team@bugrelay.local'
        text: |
          🗄️ DATABASE CRITICAL ALERT - development 🗄️
          🗄️ [dev DATABASE CRITICAL] {{ .GroupLabels.alertname }}

          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Database Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .Annotations.runbook_url }}
          
          📖 Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}
          
          Immediate database attention required!

    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#database-alerts'
        title: '🗄️ [dev] Database Critical: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          
          *Instance:* {{ .Labels.instance }}
          *Environment:* development
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}

  # Security critical alerts
  - name: 'security-critical'
    email_configs:
      - to: 'security-team@bugrelay.local'
        text: |
          🔒 SECURITY CRITICAL ALERT - development 🔒
          🔒 [dev SECURITY CRITICAL] {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}
          
          Immediate security investigation required!

    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#security-alerts'
        title: '🔒 [dev] Security Critical: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          
          *Instance:* {{ .Labels.instance }}
          *Environment:* development
          {{ end }}

  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'ops-team@bugrelay.local'
        text: |
          ⚠️ WARNING ALERT - development ⚠️ 
          ⚠️ [dev WARNING] {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .Annotations.runbook_url }}
          
          📖 Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
          {{ end }}

    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#alerts-warning'
        title: '⚠️ [dev] Warning: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          
          *Service:* {{ .Labels.service }}
          *Environment:* development
          {{ end }}
        send_resolved: true

  # Security warnings
  - name: 'security-warnings'
    email_configs:
      - to: 'security-team@bugrelay.local'
        text: |
          🔍 SECURITY WARNING - development 🔍 
          🔍 [dev SECURITY WARNING] {{ .GroupLabels.alertname }}

          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}

    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#security-alerts'
        title: '🔍 [dev] Security Warning: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          *Environment:* development
          {{ end }}

  # Monitoring system alerts
  - name: 'monitoring-alerts'
    email_configs:
      - to: 'ops-team@bugrelay.local'
        text: |
          📊 MONITORING SYSTEM ALERT - development 📊
          📊 [dev MONITORING] {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.job }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}

  # Deployment alerts - general
  - name: 'deployment-alerts'
    email_configs:
      - to: 'dev-team@bugrelay.local'
        text: |
          🚀 DEPLOYMENT ALERT - development 🚀
          🚀 [dev DEPLOYMENT] {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Component: {{ .Labels.component }}
          Version: {{ .Labels.version }}
          Deployer: {{ .Labels.deployer }}
          Started: {{ .StartsAt }}
          {{ end }}

    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#deployments'
        title: '🚀 [dev] Deployment: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          
          *Component:* {{ .Labels.component }}
          *Version:* {{ .Labels.version }}
          *Deployer:* {{ .Labels.deployer }}
          *Environment:* development
          {{ end }}
        send_resolved: true

  # Critical deployment alerts (failures, rollbacks)
  - name: 'deployment-critical'
    email_configs:
      - to: 'ops-team@bugrelay.local,dev-team@bugrelay.local'
        text: |
          🚨 CRITICAL DEPLOYMENT ALERT - development 🚨
          🚨 [dev DEPLOYMENT CRITICAL] {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Component: {{ .Labels.component }}
          Version: {{ .Labels.version }}
          Deployer: {{ .Labels.deployer }}
          Started: {{ .StartsAt }}
          {{ end }}
          
          Immediate attention required for deployment issue!
        headers:
          X-Priority: 'high'
          X-Environment: 'development'

    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#deployments-critical'
        title: '🚨 [dev] Critical Deployment: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          
          *Component:* {{ .Labels.component }}
          *Version:* {{ .Labels.version }}
          *Deployer:* {{ .Labels.deployer }}
          *Environment:* development
          {{ end }}
        send_resolved: true

    # PagerDuty for critical deployment issues in production
    pagerduty_configs:
      - routing_key: '-'
        description: '[dev] Critical Deployment: {{ .GroupLabels.alertname }} - {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        severity: 'critical'

  # Warning deployment alerts (health checks, long running)
  - name: 'deployment-warnings'
    email_configs:
      - to: 'dev-team@bugrelay.local'
        text: |
          ⚠️ DEPLOYMENT WARNING - development ⚠️
          ⚠️ [dev DEPLOYMENT WARNING] {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Component: {{ .Labels.component }}
          Version: {{ .Labels.version }}
          Deployer: {{ .Labels.deployer }}
          Started: {{ .StartsAt }}
          {{ end }}

    slack_configs:
      - api_url: 'https://hooks.slack.com/services'
        channel: '#deployments'
        title: '⚠️ [dev] Deployment Warning: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          
          *Component:* {{ .Labels.component }}
          *Version:* {{ .Labels.version }}
          *Deployer:* {{ .Labels.deployer }}
          *Environment:* development
          {{ end }}
        send_resolved: true

inhibit_rules:
  # Inhibit warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']

  # Inhibit individual service alerts when the whole application is down
  - source_match:
      alertname: 'ApplicationDown'
    target_match_re:
      alertname: '(HighErrorRate|HighResponseTime|DatabaseConnectionFailure)'
    equal: ['instance']

  # Inhibit container alerts when the node is down
  - source_match_re:
      alertname: '(NodeDown|InstanceDown)'
    target_match_re:
      alertname: 'Container.*'
    equal: ['instance']
