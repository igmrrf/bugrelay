groups:
  - name: bugrelay_alerts
    rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      # Database Connection Issues
      - alert: DatabaseConnectionFailure
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection failure"
          description: "PostgreSQL database is down"

      # Redis Connection Issues
      - alert: RedisConnectionFailure
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis connection failure"
          description: "Redis cache is down"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value | humanizePercentage }} full"

      # Application Down
      - alert: ApplicationDown
        expr: up{job="bugrelay-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BugRelay backend is down"
          description: "The BugRelay backend application is not responding"

      # Security Alert - Too Many Failed Logins
      - alert: TooManyFailedLogins
        expr: increase(http_requests_total{path="/api/v1/auth/login",status="401"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Too many failed login attempts"
          description: "{{ $value }} failed login attempts in the last 5 minutes"

      # Rate Limiting Triggered
      - alert: RateLimitingTriggered
        expr: increase(http_requests_total{status="429"}[5m]) > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiting frequently triggered"
          description: "{{ $value }} rate limit violations in the last 5 minutes"

  - name: deployment_alerts
    rules:
      # Deployment Failure
      - alert: DeploymentFailure
        expr: increase(deployment_total{status="failed"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          alert_type: deployment
        annotations:
          summary: "Deployment failed for {{ $labels.component }}"
          description: "Deployment of {{ $labels.component }} version {{ $labels.version }} failed. Deployer: {{ $labels.deployer }}"

      # Deployment Rollback
      - alert: DeploymentRollback
        expr: increase(deployment_total{status="rolled_back"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          alert_type: deployment
        annotations:
          summary: "Deployment rolled back for {{ $labels.component }}"
          description: "Deployment of {{ $labels.component }} version {{ $labels.version }} was rolled back. Deployer: {{ $labels.deployer }}"

      # Health Check Failure
      - alert: DeploymentHealthCheckFailure
        expr: increase(health_check_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          alert_type: deployment
        annotations:
          summary: "Health check failed for {{ $labels.component }}"
          description: "Health check {{ $labels.check_type }} failed for {{ $labels.component }} during deployment"

      # Long Running Deployment
      - alert: LongRunningDeployment
        expr: deployment_duration_seconds > 600
        for: 0m
        labels:
          severity: warning
          alert_type: deployment
        annotations:
          summary: "Long running deployment for {{ $labels.component }}"
          description: "Deployment of {{ $labels.component }} has been running for {{ $value }} seconds"

      # High Deployment Failure Rate
      - alert: HighDeploymentFailureRate
        expr: (sum(rate(deployment_total{status="failed"}[1h])) / sum(rate(deployment_total[1h]))) > 0.2
        for: 5m
        labels:
          severity: warning
          alert_type: deployment
        annotations:
          summary: "High deployment failure rate"
          description: "Deployment failure rate is {{ $value | humanizePercentage }} over the last hour"

      # Frequent Rollbacks
      - alert: FrequentRollbacks
        expr: sum(increase(deployment_total{status="rolled_back"}[24h])) > 3
        for: 0m
        labels:
          severity: warning
          alert_type: deployment
        annotations:
          summary: "Frequent rollbacks detected"
          description: "{{ $value }} rollbacks occurred in the last 24 hours"

      # Deployment Stuck
      - alert: DeploymentStuck
        expr: time() - deployment_start_time > 1800
        for: 0m
        labels:
          severity: critical
          alert_type: deployment
        annotations:
          summary: "Deployment appears stuck for {{ $labels.component }}"
          description: "Deployment of {{ $labels.component }} has been in progress for over 30 minutes"

      # Zero Downtime Violation
      - alert: ZeroDowntimeViolation
        expr: increase(deployment_downtime_seconds[5m]) > 0
        for: 0m
        labels:
          severity: critical
          alert_type: deployment
        annotations:
          summary: "Zero-downtime deployment violated for {{ $labels.component }}"
          description: "Deployment of {{ $labels.component }} caused {{ $value }} seconds of downtime"